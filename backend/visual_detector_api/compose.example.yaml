services:
  visual-detector-api:
    build:
      context: .
    environment:
      MODEL_PATH: /models/best.pt
      MODEL_NAME: wildfire-detection-yolov8m
    volumes:
      - ${WILDFIRE_MODEL_PATH:-../../third_party/wildfire-detection/weights/best.pt}:/models/best.pt:ro
    ports:
      - "8300:8300"
